<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>삭발 귀요미</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Apple SD Gothic Neo', sans-serif; background: #e0e0e0; touch-action: none; }
        #container { width: 100vw; height: 100vh; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* UI 패널 */
        .custom-bar {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(255, 255, 255, 0.9); padding: 18px; border-radius: 20px;
            width: 180px; border: 1px solid #ccc; backdrop-filter: blur(10px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .custom-bar.hidden { transform: translateX(-240px); opacity: 0; pointer-events: none; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 22px; cursor: pointer; color: #aaa; }
        
        #open-btn {
            position: absolute; top: 20px; left: -60px; z-index: 11;
            background: white; width: 45px; height: 45px; border-radius: 0 15px 15px 0;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 1px solid #ccc; border-left: none;
            transition: left 0.3s; font-weight: bold; font-size: 22px;
        }
        #open-btn.visible { left: 0; }

        .custom-section { margin-bottom: 15px; }
        .custom-section label { display: block; font-size: 11px; font-weight: 800; color: #444; margin-bottom: 6px; }
        .picker-wrapper { display: flex; align-items: center; gap: 10px; background: #f5f5f5; padding: 6px 12px; border-radius: 15px; }
        
        input[type="color"] {
            appearance: none; -webkit-appearance: none; border: none; 
            width: 28px; height: 28px; cursor: pointer; background: none; padding: 0;
        }
        input[type="color"]::-webkit-color-swatch { border: 2px solid white; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.1); }
        .hex-code { font-size: 12px; color: #666; font-family: monospace; font-weight: bold; }

        #save-notice {
            position: absolute; top: 20px; right: 20px; background: #333;
            color: white; padding: 10px 20px; border-radius: 12px; font-size: 13px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20;
        }

        .anim-bar {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10; background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px; border-radius: 30px; backdrop-filter: blur(4px);
        }
        .anim-bar button {
            padding: 7px 14px; border-radius: 20px; border: none;
            background: rgba(255, 255, 255, 0.2); color: white; cursor: pointer; font-size: 13px;
        }
        .anim-bar button.active { background: #fff; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div id="container">
    <div id="save-notice">✨ 저장 완료!</div>
    <div id="open-btn" onclick="toggleUI(true)"> &rsaquo; </div>

    <div class="custom-bar" id="ui-panel">
        <div class="close-btn" onclick="toggleUI(false)">×</div>
        <div class="custom-section" style="margin-top: 15px;">
            <label>SKIN</label>
            <div class="picker-wrapper">
                <input type="color" id="picker-skin" oninput="updateColor('skin', this.value)">
                <span class="hex-code" id="hex-skin">#FAD7B5</span>
            </div>
        </div>
        <div class="custom-section">
            <label>TOP</label>
            <div class="picker-wrapper">
                <input type="color" id="picker-shirt" oninput="updateColor('shirt', this.value)">
                <span class="hex-code" id="hex-shirt">#FFFFFF</span>
            </div>
        </div>
        <div class="custom-section">
            <label>BOTTOM</label>
            <div class="picker-wrapper">
                <input type="color" id="picker-pants" oninput="updateColor('pants', this.value)">
                <span class="hex-code" id="hex-pants">#9FB7D3</span>
            </div>
        </div>
        <div class="custom-section">
            <label>SHOES</label>
            <div class="picker-wrapper">
                <input type="color" id="picker-shoe" oninput="updateColor('shoe', this.value)">
                <span class="hex-code" id="hex-shoe">#EEEEEE</span>
            </div>
        </div>
        <button onclick="saveToLocal()" style="width:100%; padding:12px; border-radius:15px; border:none; background:#000; color:white; font-weight:bold; cursor:pointer;">SAVE</button>
    </div>

    <div class="anim-bar">
        <button onclick="setAnim('idle')" id="btn-idle">대기</button>
        <button onclick="setAnim('walk')" id="btn-walk">걷기</button>
        <button onclick="setAnim('wave')" id="btn-wave">인사</button>
        <button onclick="setAnim('dance')" id="btn-dance">춤</button>
    </div>
    <canvas id="c"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/** 1. UI 설정 **/
function toggleUI(show) {
    document.getElementById('ui-panel').classList.toggle('hidden', !show);
    document.getElementById('open-btn').classList.toggle('visible', !show);
}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 2.3, 5.5);

const resize = () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
};
window.addEventListener('resize', resize); resize();

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xfff5e0, 0.8);
sun.position.set(4, 8, 5); sun.castShadow = true; scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(2.8, 64), new THREE.MeshStandardMaterial({color: 0xcccccc}));
ground.rotation.x = -Math.PI/2; ground.position.y = 0.5; ground.receiveShadow = true; scene.add(ground);

/** 2. 캐릭터 재질 & 조형 **/
const mats = {
    skin: new THREE.MeshStandardMaterial({color: 0xFAD7B5, roughness: 0.5}),
    shirt: new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.6}),
    pants: new THREE.MeshStandardMaterial({color: 0x9FB7D3, roughness: 0.7}),
    eye: new THREE.MeshStandardMaterial({color: 0x1a1a2e, roughness: 0.2}),
    white: new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.1}),
    shoe: new THREE.MeshStandardMaterial({color: 0xeeeeee, roughness: 0.8})
};

const sph = (r, mat) => { 
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 32), mat);
    m.castShadow = true; m.receiveShadow = true; return m;
};
const cyl = (rt, rb, h, mat) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 16), mat);
    m.castShadow = true; m.receiveShadow = true; return m;
};
const bx = (w, h, d, mat) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.castShadow = true; m.receiveShadow = true; return m;
};

const root = new THREE.Group();
scene.add(root);

const headG = new THREE.Group(); root.add(headG);
headG.add(sph(0.38, mats.skin));
const nose = sph(0.04, mats.skin); nose.position.set(0, -0.03, 0.37); headG.add(nose);
const eyeL = sph(0.055, mats.eye); eyeL.position.set(-0.12, 0.06, 0.34); headG.add(eyeL);
const eyeR = sph(0.055, mats.eye); eyeR.position.set(0.12, 0.06, 0.34); headG.add(eyeR);
const hlL = sph(0.02, mats.white); hlL.position.set(-0.1, 0.09, 0.385); headG.add(hlL);
const hlR = sph(0.02, mats.white); hlR.position.set(0.14, 0.09, 0.385); headG.add(hlR);

const neck = cyl(0.12, 0.14, 0.1, mats.skin); root.add(neck);
const torso = cyl(0.32, 0.34, 0.72, mats.shirt); root.add(torso);
const collar = cyl(0.25, 0.28, 0.08, mats.shirt); root.add(collar);
const hip = cyl(0.33, 0.30, 0.28, mats.pants); root.add(hip);

function createArm(isLeft) {
    const group = new THREE.Group();
    const upper = cyl(0.1, 0.09, 0.38, mats.shirt); upper.position.set(isLeft ? -0.08 : 0.08, -0.19, 0); group.add(upper);
    const elbowG = new THREE.Group(); elbowG.position.set(isLeft ? -0.08 : 0.08, -0.38, 0); group.add(elbowG);
    const fore = cyl(0.085, 0.075, 0.32, mats.skin); fore.position.y = -0.16; elbowG.add(fore);
    const hand = sph(0.1, mats.skin); hand.position.y = -0.34; elbowG.add(hand);
    const shBall = sph(0.13, mats.shirt); shBall.position.set(isLeft ? -0.05 : 0.05, 0, 0); group.add(shBall);
    return { group, elbow: elbowG };
}
const armL = createArm(true); root.add(armL.group);
const armR = createArm(false); root.add(armR.group);

function createLeg(isLeft) {
    const group = new THREE.Group();
    const thigh = cyl(0.13, 0.12, 0.38, mats.pants); thigh.position.y = -0.19; group.add(thigh);
    const kneeG = new THREE.Group(); kneeG.position.y = -0.38; group.add(kneeG);
       const kneeBall = sph(0.11, mats.pants);
    kneeBall.position.y = 0;
    kneeG.add(kneeBall);
    const shin = cyl(0.11, 0.1, 0.36, mats.pants); shin.position.y = -0.18; kneeG.add(shin);
    const shoe = bx(0.18, 0.12, 0.3, mats.shoe); shoe.position.set(0, -0.4, 0.06); kneeG.add(shoe);
    return { group, knee: kneeG };
}
const legL = createLeg(true); root.add(legL.group);
const legR = createLeg(false); root.add(legR.group);

/** 3. 저장 및 컬러 기능 **/
const config = { skin: '#FAD7B5', shirt: '#ffffff', pants: '#9FB7D3', shoe: '#eeeeee' };

// [수정] 컬러 업데이트 및 UI 반영
window.updateColor = (part, hex) => {
    if(mats[part]) {
        mats[part].color.set(hex);
        config[part] = hex;
        const hexDisp = document.getElementById(`hex-${part}`);
        const picker = document.getElementById(`picker-${part}`);
        if(hexDisp) hexDisp.innerText = hex.toUpperCase();
        if(picker) picker.value = hex;
    }
};

// [수정] 데이터 로드 로직
function loadSavedData() {
    const saved = localStorage.getItem('myGwiYomiSavedData');
    if(saved) {
        const data = JSON.parse(saved);
        Object.keys(data).forEach(key => {
            updateColor(key, data[key]);
        });
    }
}

window.saveToLocal = () => {
    localStorage.setItem('myGwiYomiSavedData', JSON.stringify(config));
    const n = document.getElementById('save-notice');
    n.style.opacity = 1; setTimeout(() => n.style.opacity = 0, 1500);
};

// 페이지 시작 시 로드
loadSavedData();

// 드래그 로직
let dragging = false, px = 0, rotY = 0.3;
const onStart = (e) => { 
    if(e.target.closest('.custom-bar') || e.target.closest('.anim-bar')) return;
    dragging = true; px = e.touches ? e.touches[0].clientX : e.clientX; 
};
const onMove = (e) => {
    if(!dragging) return;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    rotY += (cx - px) * 0.01; px = cx;
};
canvas.addEventListener('mousedown', onStart); canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('touchstart', onStart); canvas.addEventListener('touchmove', onMove);
window.addEventListener('touchend', () => dragging = false);

/** 4. 애니메이션 **/
let currentAnim = 'idle', animTime = 0;
window.setAnim = (n) => {
    currentAnim = n; animTime = 0;
    document.querySelectorAll('.anim-bar button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + n).classList.add('active');
};
setAnim('idle');

function tick(dt) {
    animTime += dt; const t = animTime;
    headG.position.set(0, 1.85, 0); neck.position.set(0, 1.48, 0);
    torso.position.set(0, 1.08, 0); collar.position.set(0, 1.42, 0); hip.position.set(0, 0.68, 0);
    armL.group.position.set(-0.34, 1.38, 0); armR.group.position.set(0.34, 1.38, 0);
    legL.group.position.set(-0.17, 0.54, 0); legR.group.position.set(0.17, 0.54, 0);
    [armL.group, armR.group, armL.elbow, armR.elbow, legL.group, legR.group, legL.knee, legR.knee, headG].forEach(g => g.rotation.set(0,0,0));

    const baseH = 1.05; root.position.y = baseH;

    if(currentAnim === 'idle') {
        root.position.y = baseH + Math.sin(t * 1.5) * 0.02;
        armL.group.rotation.z = -0.15 + Math.sin(t * 1.5) * 0.03;
        armR.group.rotation.z = 0.15 - Math.sin(t * 1.5) * 0.03;
    } else if(currentAnim === 'walk') {
        const s = Math.sin(t * 4.5);
        root.position.y = baseH + Math.abs(Math.sin(t * 4.5)) * 0.045;
        legL.group.rotation.x = s * 0.6; legR.group.rotation.x = -s * 0.6;
        legL.group.rotation.z = Math.sin(t * 4.5) * 0.05;
legR.group.rotation.z = -Math.sin(t * 4.5) * 0.05;
        legL.knee.rotation.x = Math.max(0, -s) * 0.8; legR.knee.rotation.x = Math.max(0, s) * 0.8;
        armL.group.rotation.x = -s * 0.4; armR.group.rotation.x = s * 0.4;
    } else if(currentAnim === 'wave') {
        armR.group.rotation.x = -1.6; armR.group.rotation.z = 0.4 + Math.sin(t * 5) * 0.2;
        armR.elbow.rotation.x = -0.5; headG.rotation.y = 0.2;
    } else if(currentAnim === 'dance') {
        const s = Math.sin(t * 5); root.position.y = baseH + Math.abs(s) * 0.1;
        root.rotation.y += dt * 2; armL.group.rotation.z = -1; armR.group.rotation.z = 1;
    }
}

let last = performance.now();
(function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    tick(dt);
    root.rotation.y = rotY;
    renderer.render(scene, camera);
})(performance.now());
</script>
</body>
</html>
