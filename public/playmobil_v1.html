<div style="width:100%;height:620px;position:relative;">
  <canvas id="c" style="width:100%;height:100%;display:block;"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const canvas = document.getElementById('c');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  alpha:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();

/* camera만 수정 */
const camera = new THREE.PerspectiveCamera(
  42,
  canvas.parentElement.clientWidth / canvas.parentElement.clientHeight,
  0.1,
  100
);

camera.position.set(0,1.8,5.5);
camera.lookAt(0,0.8,0);

/* resize */
function resize(){
  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;

  renderer.setSize(w,h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* light */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const sun = new THREE.DirectionalLight(0xfff5e0, 0.65);
sun.position.set(4,8,5);
scene.add(sun);

const rim = new THREE.DirectionalLight(0x99aacc, 0.25);
rim.position.set(-4,3,-3);
scene.add(rim);

/* =========================
   CHARACTER (그대로 유지)
========================= */

const C = {
  skin:  0xF0B878,
  shirt: 0xDDDAD2,
  pants: 0xB8A882,
  shoe:  0xEEEBE4,
  soleS: 0xAAAAAA,
  eye:   0x1a1a2e,
  smile: 0xaa3311,
};

const std = (c,r=0.55)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const sh = m=>{m.castShadow=true;m.receiveShadow=true;return m;};
const sph = (r,c)=>sh(new THREE.Mesh(new THREE.SphereGeometry(r,32,32),std(c)));
const cyl = (rt,rb,h,c)=>sh(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,16),std(c)));
const bx  = (w,h,d,c)=>sh(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),std(c)));

const root = new THREE.Group();
scene.add(root);

/* 머리 */
const headG = new THREE.Group();
headG.position.y = 1.85;
root.add(headG);
headG.add(sph(0.38,C.skin));

const eyeL = sph(0.055,C.eye); eyeL.position.set(-0.12,0.06,0.34); headG.add(eyeL);
const eyeR = sph(0.055,C.eye); eyeR.position.set(0.12,0.06,0.34); headG.add(eyeR);
const hlL = sph(0.02,0xffffff); hlL.position.set(-0.1,0.09,0.385); headG.add(hlL);
const hlR = sph(0.02,0xffffff); hlR.position.set(0.14,0.09,0.385); headG.add(hlR);
const smM = bx(0.1,0.022,0.01,C.smile); smM.position.set(0,-0.11,0.376); headG.add(smM);
const nose = sph(0.03,0xd89060); nose.position.set(0,-0.03,0.375); headG.add(nose);

/* 목 */
const neck = cyl(0.12,0.14,0.1,C.skin); neck.position.y=1.48; root.add(neck);

/* 몸 */
const torso = cyl(0.32,0.34,0.72,C.shirt); torso.position.y=1.08; root.add(torso);
const collar = cyl(0.25,0.28,0.08,C.shirt); collar.position.y=1.42; root.add(collar);

/* 하체 */
const hip = cyl(0.33,0.30,0.28,C.pants); hip.position.y=0.68; root.add(hip);

/* 팔 */
const lShG = new THREE.Group(); lShG.position.set(-0.32,1.38,0); root.add(lShG);
const lUA = cyl(0.1,0.09,0.38,C.shirt); lUA.position.set(-0.1,-0.19,0); lShG.add(lUA);
const lElG = new THREE.Group(); lElG.position.set(-0.1,-0.38,0); lShG.add(lElG);
lElG.add(cyl(0.085,0.075,0.32,C.skin));
const lFAm = cyl(0.085,0.075,0.32,C.skin);
lFAm.position.y = -0.16;
lElG.add(lFAm);
const lHand = sph(0.1,C.skin); lHand.position.y=-0.34; lElG.add(lHand);

const rShG = new THREE.Group(); rShG.position.set(0.32,1.38,0); root.add(rShG);
const rUA = cyl(0.1,0.09,0.38,C.shirt); rUA.position.set(0.1,-0.19,0); rShG.add(rUA);
const rElG = new THREE.Group(); rElG.position.set(0.1,-0.38,0); rShG.add(rElG);
rElG.add(cyl(0.085,0.075,0.32,C.skin));
const rFAm = cyl(0.085,0.075,0.32,C.skin); rFAm.position.y=-0.16; rElG.add(rFAm);
const rHand = sph(0.1,C.skin); rHand.position.y=-0.34; rElG.add(rHand);

const lShBall = sph(0.13,C.shirt); lShBall.position.set(-0.37,1.38,0); root.add(lShBall);
const rShBall = sph(0.13,C.shirt); rShBall.position.set(0.37,1.38,0); root.add(rShBall);

/* 다리 */
const lHipG = new THREE.Group(); lHipG.position.set(-0.17,0.54,0); root.add(lHipG);
const lThigh = cyl(0.13,0.12,0.38,C.pants); lThigh.position.y=-0.19; lHipG.add(lThigh);
const lKneeG = new THREE.Group(); lKneeG.position.y=-0.38; lHipG.add(lKneeG);
const lShin = cyl(0.11,0.10,0.36,C.pants); lShin.position.y=-0.18; lKneeG.add(lShin);

const lShoeBody = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.1,0.28),std(C.shoe));
lShoeBody.position.set(0,-0.41,0.05); lKneeG.add(lShoeBody);

const lSole = new THREE.Mesh(new THREE.BoxGeometry(0.19,0.04,0.29),std(C.soleS));
lSole.position.set(0,-0.47,0.05); lKneeG.add(lSole);

const rHipG = new THREE.Group(); rHipG.position.set(0.17,0.54,0); root.add(rHipG);
const rThigh = cyl(0.13,0.12,0.38,C.pants); rThigh.position.y=-0.19; rHipG.add(rThigh);
const rKneeG = new THREE.Group(); rKneeG.position.y=-0.38; rHipG.add(rKneeG);
const rShin = cyl(0.11,0.10,0.36,C.pants); rShin.position.y=-0.18; rKneeG.add(rShin);

const rShoeBody = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.1,0.28),std(C.shoe));
rShoeBody.position.set(0,-0.41,0.05); rKneeG.add(rShoeBody);

const rSole = new THREE.Mesh(new THREE.BoxGeometry(0.19,0.04,0.29),std(C.soleS));
rSole.position.set(0,-0.47,0.05); rKneeG.add(rSole);
function loop(){
  requestAnimationFrame(loop);

  root.rotation.y = 0;   // 회전 제거 (고정)
  renderer.render(scene, camera);
}

loop();
</script>
